<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Clip left half -->
    <clipPath id="left-half">
      <rect x="0" y="0" width="32" height="64" />
    </clipPath>
    <!-- Clip right half -->
    <clipPath id="right-half">
      <rect x="32" y="0" width="32" height="64" />
    </clipPath>
    
    <!-- Grayscale filter for left side -->
    <filter id="bw">
      <feColorMatrix type="matrix" 
        values="0.3333 0.3333 0.3333 0 0
                0.3333 0.3333 0.3333 0 0
                0.3333 0.3333 0.3333 0 0
                0      0      0      1 0"/>
    </filter>

    <!-- Color Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="mountain1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="mountain2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Base Landscape Group -->
  <g id="landscape-color">
    <!-- Sky -->
    <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#skyGrad)" />
    
    <!-- Sun -->
    <circle cx="32" cy="24" r="10" fill="url(#sunGrad)" />
    
    <!-- Far Mountains -->
    <polygon points="4,48 24,20 44,48" fill="url(#mountain1)" opacity="0.9" />
    <polygon points="26,48 44,26 60,48" fill="#4f46e5" opacity="0.8" />
    
    <!-- Snow peaks -->
    <polygon points="24,20 20,26 24,25 28,26" fill="#ffffff" />
    <polygon points="44,26 40,31 44,30 48,31" fill="#ffffff" />

    <!-- Near Hills / Foreground -->
    <path d="M2,62 L2,44 Q18,36 34,46 Q50,56 62,42 L62,62 Z" fill="url(#mountain2)" />
    <path d="M2,62 L2,50 Q20,44 42,54 L62,48 L62,62 Z" fill="#047857" />
  </g>

  <!-- Left Half with Grayscale Filter -->
  <g clip-path="url(#left-half)" filter="url(#bw)">
    <use href="#landscape-color" />
  </g>

  <!-- Right Half (Color preserved) -->
  <g clip-path="url(#right-half)">
    <use href="#landscape-color" />
  </g>

  <!-- Frame Border -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Split Divider Line in Center -->
  <line x1="32" y1="2" x2="32" y2="62" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="2" x2="32" y2="62" stroke="#0f172a" stroke-width="1" stroke-dasharray="3 2" />

  <!-- Splitter Center Handle/Knob -->
  <circle cx="32" cy="32" r="5" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <path d="M30 32 L34 32" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
  <path d="M32 30 L32 34" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" />
</svg>
